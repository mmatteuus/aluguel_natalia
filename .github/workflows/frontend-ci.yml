name: Frontend CI

on:
  push:
    branches: [main, feat/landing-imersiva]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies and refresh lockfile
        run: npm install

      - name: Verify frontend
        run: npm run verify

      - name: Audit critical dependencies
        run: npm audit --audit-level=critical

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser and accessibility checks
        run: npm run test:e2e

      - name: Persist lockfile changes
        if: github.event_name == 'push' && github.ref_name == 'feat/landing-imersiva'
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json || git status --porcelain package-lock.json | grep -q '^??'; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore: refresh frontend lockfile'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
